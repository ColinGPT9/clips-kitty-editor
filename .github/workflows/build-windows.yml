# Clips Kitty Editor: a Windows test build of the editor, by hand.
#
# The same environment and steps as build-app.yml's Windows job - the
# pinned toolchain, BtbN's FFmpeg 8.1 LGPL shared build, ONNX Runtime,
# LLVM for libclang, whisper.cpp's CPU modules as DLLs - but with the
# `release` profile and thin LTO, for a build in a fraction of the time, and
# nothing packaged: the staged folder (clips-kitty-editor.exe, its DLLs and notices) is
# uploaded as an artifact, to be tried inside the Clips Kitty window.
#
# Started by hand (workflow_dispatch), or by a push to a kitty/* branch
# whose head commit says "[build]".
name: Build Windows (test)

on:
  workflow_dispatch:
  push:
    branches: ["kitty/**"]

env:
  CARGO_TERM_COLOR: always
  ORT_VERSION: 1.28.0
  GGML_NATIVE: "OFF"
  GGML_BACKEND_DL: "ON"
  GGML_CPU_ALL_VARIANTS: "ON"
  GGML_AVX2: "OFF"
  GGML_FMA: "OFF"
  GGML_F16C: "OFF"
  GGML_BMI2: "OFF"
  # A test build: optimised, with thin LTO rather than the shipping profile's fat LTO. Some LTO is
  # needed: without it whisper-rs keeps SystemInfo::default, whose ggml_cpu_has_* live in the CPU-module
  # DLLs (GGML_BACKEND_DL), and the link fails (run 44006803371).
  CARGO_PROFILE_RELEASE_LTO: "thin"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: windows-x86_64 (test)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The pinned toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' src/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (v1), 2026-10-09
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Read the version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src/Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Clips Kitty Editor $version (based on Concat) at $(git rev-parse --short HEAD)"

      - name: FFmpeg development libraries and LLVM (Windows)
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bash = "$env:ProgramFiles\Git\bin\bash.exe"
          & $bash scripts/ci/fetch.sh "llvm-win64" llvm.exe
          if ($LASTEXITCODE -ne 0) { throw "the LLVM download failed" }
          Start-Process -Wait -FilePath .\llvm.exe -ArgumentList "/S", "/D=C:\llvm"
          if (-not (Test-Path C:\llvm\bin\libclang.dll)) { throw "LLVM did not install to C:\llvm" }
          Remove-Item llvm.exe -ErrorAction SilentlyContinue
          "C:\llvm\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "LIBCLANG_PATH=C:\llvm\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $bash scripts/ci/fetch.sh "ffmpeg-win64" ffmpeg-win.zip
          if ($LASTEXITCODE -ne 0) { throw "the FFmpeg download failed" }
          Expand-Archive ffmpeg-win.zip -DestinationPath ffdl
          $dir = (Get-ChildItem ffdl -Directory | Select-Object -First 1).FullName
          "FFMPEG_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$dir\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: ONNX Runtime (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:ProgramFiles\Git\bin\bash.exe" scripts/ci/fetch.sh "onnxruntime-win-x64" onnxruntime.zip
          if ($LASTEXITCODE -ne 0) { throw "the ONNX Runtime download failed" }
          Expand-Archive onnxruntime.zip -DestinationPath .
          $dir = "$PWD\onnxruntime-win-x64-$env:ORT_VERSION"
          if (-not (Test-Path "$dir\lib\onnxruntime.lib")) { throw "$dir\lib\onnxruntime.lib is not there" }
          if (-not (Test-Path "$dir\lib\onnxruntime.dll")) { throw "$dir\lib\onnxruntime.dll is not there" }
          "ORT_LIB_LOCATION=$dir\lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ORT_PREFER_DYNAMIC_LINK=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ORT_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$dir\lib" | Out-File -FilePath $env:GITHUB_PATH -Append

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src
          key: x86_64-pc-windows-msvc-test-release
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST GGML ORT

      - name: Build
        timeout-minutes: 90
        shell: bash
        working-directory: src
        run: |
          set -o pipefail
          cargo build --release -p concat --target x86_64-pc-windows-msvc 2>&1 | tee build.log

      - name: Build log to the summary (failure only)
        if: failure()
        shell: bash
        run: |
          if [ -f src/build.log ]; then
            {
              echo "### Build failed"
              echo '```'
              grep -n -E "^(error|warning: unused)|^\s+-->" src/build.log | head -n 80
              echo '---'
              tail -n 150 src/build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Tests of the changed parts (launch options, host methods)
        timeout-minutes: 30
        continue-on-error: true
        shell: bash
        working-directory: src
        run: |
          set -o pipefail
          cargo test --release -p concat-server --target x86_64-pc-windows-msvc 2>&1 | tail -n 40
          cargo test --release -p concat --bin clips-kitty-editor --target x86_64-pc-windows-msvc 2>&1 | tail -n 40
          cargo test --release -p concat-host --lib --target x86_64-pc-windows-msvc brand:: 2>&1 | tail -n 20
          cargo test --release -p concat --lib --target x86_64-pc-windows-msvc embed:: 2>&1 | tail -n 30

      - name: Stage (Windows)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $dir = "stage\clips-kitty-editor-windows-x86_64"
          $out = "src\target\x86_64-pc-windows-msvc\release"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "$out\clips-kitty-editor.exe" $dir
          Copy-Item "$env:FFMPEG_DIR\bin\*.dll" $dir
          Copy-Item "$env:ORT_DIR\lib\*.dll" $dir
          $built = Get-ChildItem "$out\build\whisper-rs-sys-*\out\bin\ggml-cpu-x64.dll" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $built) { throw "whisper-rs-sys installed no ggml-cpu-x64.dll" }
          Write-Host "whisper's build: $($built.DirectoryName)"
          Copy-Item "$($built.DirectoryName)\whisper.dll", "$($built.DirectoryName)\ggml*.dll" $dir
          foreach ($module in "x64", "sandybridge", "haswell") {
            if (-not (Test-Path "$dir\ggml-cpu-$module.dll")) { throw "ggml-cpu-$module.dll is missing from the build" }
          }
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, PATCHES.md $dir
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -Directory |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw "no Visual C++ redistributable folder for x64 under $vs" }
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find "VC\Tools\MSVC\**\bin\Host*\*\dumpbin.exe" | Select-Object -First 1
          foreach ($pass in 1, 2) {
            foreach ($pe in Get-ChildItem $dir -File -Include *.exe, *.dll -Recurse) {
              foreach ($line in & $dumpbin /nologo /dependents $pe.FullName) {
                $dll = $line.Trim()
                if ($dll -match "\.dll$" -and (Test-Path "$($crt.FullName)\$dll") -and -not (Test-Path "$dir\$dll")) {
                  Write-Host "$($pe.Name) imports $dll; copying it from $($crt.FullName)"
                  Copy-Item "$($crt.FullName)\$dll" $dir
                }
              }
            }
          }
          $commit = git rev-parse HEAD
          "Clips Kitty Editor $env:VERSION, based on Concat $env:VERSION, built at $commit (run ${{ github.run_id }}), release profile, thin LTO." |
            Out-File -Encoding utf8 "$dir\BUILD.txt"
          Get-ChildItem $dir | Format-Table Name, Length

      - name: Smoke test (Windows)
        timeout-minutes: 15
        continue-on-error: true
        shell: pwsh
        run: scripts/ci/smoke-windows.ps1 -Bundle "stage\clips-kitty-editor-windows-x86_64"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clips-kitty-editor-windows-x86_64
          path: stage/clips-kitty-editor-windows-x86_64
          if-no-files-found: error
          retention-days: 14
